name: Daily update

on:
  schedule:
    # 07:30 UTC = 台北 15:30（收盤後兩小時，資料已上架）
    - cron: '30 7 * * 1-5'
  workflow_dispatch:      # 也可以手動按

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas requests pyarrow

      - name: Fetch today
        run: python scripts/daily_update.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data $(date +%Y-%m-%d)"
          git push
