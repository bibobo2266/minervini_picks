name: 資金曲線回測

on:
  workflow_dispatch:
    inputs:
      capital:
        description: "起始資金（可多組，逗號分隔，例如 1000000,3000000,5000000）"
        required: true
        default: "1000000,3000000,5000000,10000000"
      grid:
        description: "配置：部位%x最大檔數，逗號分隔"
        required: true
        default: "2.5x40,5x20,10x10"
      stop:
        description: "停損 %"
        required: true
        default: "12"
      seeds:
        description: "隨機種子組數（越多越穩，越慢）"
        required: true
        default: "6"
      commit:
        description: "把結果檔案提交回 repo"
        type: boolean
        required: false
        default: false

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas pyarrow numpy
          fi
          pip install tabulate

      - name: 執行
        run: |
          set -o pipefail
          : > run.log
          IFS=',' read -ra CAPS <<< "${{ inputs.capital }}"
          for CAP in "${CAPS[@]}"; do
            CAP=$(echo "$CAP" | xargs)
            echo "" | tee -a run.log
            echo "############ 起始資金 $CAP ############" | tee -a run.log
            python scripts/portfolio_backtest.py \
              --capital "$CAP" \
              --grid "${{ inputs.grid }}" \
              --stop "${{ inputs.stop }}" \
              --seeds "${{ inputs.seeds }}" 2>&1 | tee -a run.log
            # 每組資金的明細另存一份，免得被下一組覆蓋
            if [ -d data/portfolio ]; then
              mkdir -p "data/portfolio/cap_$CAP"
              cp data/portfolio/*.csv "data/portfolio/cap_$CAP/" 2>/dev/null || true
            fi
          done

      - name: 寫進 job summary（手機直接讀這裡）
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## 資金曲線回測"
            echo ""
            echo "配置 \`${{ inputs.grid }}\`　停損 \`-${{ inputs.stop }}%\`　種子 \`${{ inputs.seeds }}\` 組"
            echo ""
            echo '```'
            tail -c 400000 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上傳結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-backtest
          path: |
            run.log
            data/portfolio/**
          if-no-files-found: warn

      - name: 提交回 repo
        if: ${{ inputs.commit }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio
          if git diff --cached --quiet; then
            echo "沒有變更，不提交"
          else
            git commit -m "chore(data): 資金曲線回測結果"
            git pull --rebase --autostash
            git push
          fi
