name: 修正 available_date（一次性維護）

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只試算不寫檔（第一次先勾這個）"
        type: boolean
        required: false
        default: true

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas pyarrow numpy requests
          fi

      - name: 執行
        run: |
          set -o pipefail
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/fix_available_date.py --dry-run 2>&1 | tee run.log
          else
            python scripts/fix_available_date.py 2>&1 | tee run.log
          fi

      - name: 寫進 job summary
        if: always()
        continue-on-error: true
        run: |
          {
            echo "## 修正 available_date（dry_run = ${{ inputs.dry_run }}）"
            echo ""
            echo '```'
            cat run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 提交回 repo
        if: ${{ inputs.dry_run == false }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/fundamentals
          if git diff --cached --quiet; then
            echo "沒有變更，不提交"
          else
            git commit -m "fix(data): 月營收 available_date 往前修正一個月"
            git pull --rebase --autostash
            git push
          fi
