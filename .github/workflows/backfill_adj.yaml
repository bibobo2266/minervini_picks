name: Backfill adjusted

# 手動觸發。9 年 × 2150 檔約 4 小時，超過就分批：
# 跑完一次沒跑完，再按一次 Run workflow 即可續跑（已完成的記在 data/adj/_done.txt）。
on:
  workflow_dispatch:
    inputs:
      start:
        description: '起始日期'
        default: '2017-01-01'
      limit:
        description: '只跑前 N 檔（0 = 全部，第一次測試填 30）'
        default: '30'

permissions:
  contents: write

jobs:
  backfill-adj:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas requests pyarrow

      - name: Run backfill (adjusted)
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/backfill_adj.py --start ${{ inputs.start }} --limit ${{ inputs.limit }}

      - name: Commit
        # timeout 被砍掉時這步不會執行，但下次續跑會從 _done.txt 接上
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "backfill adj $(date +%Y-%m-%d)"
          git pull --rebase || true
          git push
