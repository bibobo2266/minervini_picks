name: build_institutional

on:
  workflow_dispatch:
    inputs:
      parts:
        description: "要抓哪幾塊（stock,total,futures）"
        default: "total,futures"
      start:
        description: "起始日"
        default: "2015-06-01"
      end:
        description: "結束日（空白=今天）"
        default: ""
      sleep:
        description: "每次請求間隔秒數"
        default: "0.6"

permissions:
  contents: write

concurrency:
  group: inst-write
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install "pandas<3" pyarrow requests

      - name: 抓取三大法人
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: |
          python scripts/build_institutional.py \
            --parts "${{ inputs.parts }}" \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --sleep "${{ inputs.sleep }}"

      # 2026-09-07 事故：抓了一小時、12 個年份檔都寫好也 commit 了，
      # 但這一小時內另一支 workflow 推了新 commit，push 變成
      # non-fast-forward 被拒。舊寫法是 `git push || true`，失敗被吞掉，
      # job 顯示綠色，資料隨 runner workspace 一起消失，只能整個重抓。
      #
      # 這一版：
      #   1. 先把產出複製到 /tmp（脫離 git 掌控）
      #   2. 重新對齊到最新的 origin/main，再把產出放回去
      #   3. push 失敗就重試，最多五次
      #   4. 五次都失敗就 exit 1 讓 job 變紅，絕不再靜默吞掉
      # 用 fetch + checkout -B 而不是 pull --rebase，是因為 checkout@v4
      # 預設淺複製，rebase 在淺歷史上不可靠。
      - name: Commit
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          if [ ! -d data/inst ]; then
            echo "沒有 data/inst，無產出可推"
            exit 0
          fi
          rm -rf /tmp/inst && mkdir -p /tmp/inst
          cp -a data/inst/. /tmp/inst/
          echo "暫存 $(ls -1 /tmp/inst | wc -l) 個檔案到 /tmp/inst"

          for i in 1 2 3 4 5; do
            git fetch --depth=1 origin main
            git checkout -q -f -B main FETCH_HEAD
            mkdir -p data/inst
            cp -a /tmp/inst/. data/inst/
            git add -A data/inst

            if git diff --cached --quiet; then
              echo "無變更"
              exit 0
            fi

            git commit -q -m "inst: ${{ inputs.parts }} ${{ inputs.start }}~${{ inputs.end }}"
            if git push origin main; then
              echo "推送成功（第 $i 次嘗試）"
              git log -1 --stat
              exit 0
            fi
            echo "push 第 $i 次失敗（多半是同時有別的 workflow 推了），20 秒後重試"
            sleep 20
          done

          echo "::error::push 連續 5 次失敗，data/inst 會隨 runner 消失，必須重跑"
          exit 1
