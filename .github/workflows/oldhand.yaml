name: oldhand-cards

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '執行模式'
        type: choice
        options: [cards, frequency, outcomes]
        default: cards
      date:
        description: '指定日期 YYYY-MM-DD（留空=資料最後一天）'
        default: ''
      universe:
        description: 'universe csv（ids 留空時才用）'
        default: 'universe_defense.csv'
      ids:
        description: '直接貼代號，逗號分隔（手機最好用）：2330,2454,3008'
        default: ''
      from_signals:
        description: '從某檔案抓代號。留空且 ids 也留空時，自動用當天的原始動能訊號'
        default: ''
      limit:
        description: '最多產幾張完整卡片（含圖）。超過的只進總表'
        default: '40'
      force:
        description: '同一天要跑第二份名單就設 true'
        default: 'false'
      freq_start:
        description: 'frequency 模式的起始日'
        default: '2015-01-01'
  # 內建 cron 已移除：實測 17:30 排程延遲到 22:50 才跑，
  # 改由 cron-job.org 從外部觸發 dispatch API（跟 daily_adj 同一套機制）。

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }

      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - run: pip install pandas numpy pyarrow matplotlib tabulate

      - name: 中文字型
        if: steps.guard.outputs.already != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk

      - name: 今天跑過了沒
        # 同 daily_momentum：避免同一天被觸發兩次而寄兩封重複的卡片信。
        # 想在同一天跑第二份名單時，用 force=true 繞過。
        id: guard
        run: |
          MARK="cards/$(TZ=Asia/Taipei date +%Y-%m-%d)/index.md"
          if [ -e "$MARK" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "already=true" >> $GITHUB_OUTPUT
            echo "::notice::$MARK 已存在。要在同一天跑第二份名單請把 force 設 true"
          else
            echo "already=false" >> $GITHUB_OUTPUT
          fi

      - name: 產生看盤卡
        if: steps.guard.outputs.already != 'true'
        if: github.event.inputs.mode != 'frequency'
        run: |
          ARGS=""
          [ -n "${{ github.event.inputs.date }}" ] && ARGS="--date ${{ github.event.inputs.date }}"
          [ -n "${{ github.event.inputs.ids }}" ] && ARGS="$ARGS --ids ${{ github.event.inputs.ids }}"
          FS="${{ github.event.inputs.from_signals }}"
          UNI="${{ github.event.inputs.universe }}"
          # 優先序：ids > from_signals > universe（有明確填值） > 自動接當天原始訊號。
          # universe 要排在自動接之前 —— 否則你填了 watchlist_cpo.csv 卻永遠被
          # raw 檔蓋掉，因為每天跑動能訊號，raw 檔一定存在。
          if [ -z "${{ github.event.inputs.ids }}" ] && [ -z "$FS" ] && [ -z "$UNI" ]; then
            LATEST=$(ls -1 out/signals/raw_*.txt 2>/dev/null | sort | tail -1)
            [ -n "$LATEST" ] && FS="$LATEST" && echo "自動接上 $LATEST"
          fi
          [ -n "$FS" ] && ARGS="$ARGS --from-signals $FS"
          ARGS="$ARGS --limit ${{ github.event.inputs.limit || 40 }}"
          python scripts/oldhand_cards.py \
            --universe "${UNI:-universe_defense.csv}" $ARGS

      - name: 命中頻率統計
        if: steps.guard.outputs.already != 'true'
        if: github.event.inputs.mode == 'frequency'
        run: |
          python scripts/combo_frequency.py \
            --universe "${{ github.event.inputs.universe || 'universe_defense.csv' }}" \
            --start "${{ github.event.inputs.freq_start || '2015-01-01' }}" \
            --respect-thesis

      - name: 命中後結果統計
        if: steps.guard.outputs.already != 'true'
        if: github.event.inputs.mode == 'outcomes'
        run: |
          python scripts/combo_outcomes.py \
            --universe "${{ github.event.inputs.universe || 'universe_defense.csv' }}" \
            --start "${{ github.event.inputs.freq_start || '2015-01-01' }}" \
            --respect-thesis

      - name: 打包
        if: steps.guard.outputs.already != 'true'
        id: pack
        run: |
          DAY=$(ls -1d cards/* 2>/dev/null | sort | tail -1 | xargs -n1 basename)
          echo "day=$DAY" >> $GITHUB_OUTPUT
          SRC=$(cat "cards/$DAY/_source.txt" 2>/dev/null || echo "名單")
          echo "src=$SRC" >> $GITHUB_OUTPUT
          if [ -n "$DAY" ]; then
            zip -qr "cards_${SRC}_$DAY.zip" "cards/$DAY"
            # 總表轉成純文字放進信件內文，手機上不用開附件就看得到
            sed -n '1,60p' "cards/$DAY/index.md" > mail_body.txt
            echo "" >> mail_body.txt
            echo "完整卡片（每檔 .md + 標註圖）在附件 zip，或 repo 的 cards/$DAY/" >> mail_body.txt
          fi

      - name: 寄出卡片
        if: steps.guard.outputs.already != 'true'
        if: steps.pack.outputs.day != ''
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.GMAIL_USER }}
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          from: Oldhand Cards
          to: ${{ secrets.MAIL_TO }}
          subject: "[老手看盤] ${{ steps.pack.outputs.src }}　${{ steps.pack.outputs.day }}"
          body: file://mail_body.txt
          attachments: cards_${{ steps.pack.outputs.src }}_${{ steps.pack.outputs.day }}.zip

      - name: Commit
        if: steps.guard.outputs.already != 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cards reports || true
          git diff --staged --quiet || git commit -m "chore: oldhand $(date +%F)"
          git push
