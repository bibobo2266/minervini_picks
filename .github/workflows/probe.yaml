name: Probe datasets

# 只打幾次 API、不寫檔案。用來確認免費層拿得到哪些除權息資料集。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ⚠️ pandas 3.0 的 to_datetime 不再自動推斷混合格式，
      #    直接讀 parquet 的字串 date 欄會 ValueError，所以鎖版本。
      - run: pip install "pandas<3" requests

      - name: Probe
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/probe_datasets.py
