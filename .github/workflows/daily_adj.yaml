name: Daily update (adjusted)

# 每交易日更新 data/adj/。跟舊的 daily.yaml 併存也可以，但建議停用舊的——
# prices.parquet 是未還原資料，三個 app 換到 adj 之後就不需要了。
on:
  schedule:
    # 09:00 UTC = 台北 17:00
    - cron: '0 9 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas requests pyarrow

      - name: Fetch today (adjusted)
        env:
          # 只用來查當日除權息（免費層即可）。退訂 Backer 後這支仍然能跑。
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
        run: python scripts/daily_update_adj.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "data adj $(date +%Y-%m-%d)"
          git pull --rebase || true
          git push
