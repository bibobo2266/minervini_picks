name: 公司行動偵測與修正

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "做什麼"
        type: choice
        required: true
        default: detect
        options:
          - detect          # 只偵測，產出並提交 CSV 清單
          - dry-run         # 依清單試跑，不寫檔
          - apply           # 依清單真的修正 parquet 並提交
      exclude:
        description: "排除的誤判（格式 6696@2019-05-20,4546@2020-01-02，留空表示不排除）"
        required: false
        default: ""

# 不要跟回補 workflow 同時動 data/，會撞 commit
concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝套件
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pandas pyarrow numpy
          fi

      - name: 排除誤判（把指定列的判定改掉）
        if: ${{ inputs.mode != 'detect' && inputs.exclude != '' }}
        env:
          EXCLUDE: ${{ inputs.exclude }}
        run: |
          python - <<'PY'
          import os, pandas as pd
          p = "data/adj/corporate_actions_detected.csv"
          df = pd.read_csv(p, dtype={"stock_id": str})
          n = 0
          for item in os.environ["EXCLUDE"].split(","):
              item = item.strip()
              if not item:
                  continue
              sid, _, day = item.partition("@")
              m = (df["stock_id"] == sid.strip())
              if day.strip():
                  m &= (df["event_date"] == day.strip())
              n += int((m & (df["判定"] == "建議修正")).sum())
              df.loc[m, "判定"] = "人工排除"
          df.to_csv(p, index=False, encoding="utf-8-sig")
          print(f"已排除 {n} 筆")
          PY

      - name: 執行
        id: run
        run: |
          set -o pipefail
          case "${{ inputs.mode }}" in
            detect)  ARGS="--detect" ;;
            dry-run) ARGS="--apply --dry-run" ;;
            apply)   ARGS="--apply" ;;
          esac
          python scripts/fix_corporate_actions.py $ARGS 2>&1 | tee run.log

      - name: 寫進 job summary（手機直接讀這裡）
        if: always()
        run: |
          {
            echo "## \`${{ inputs.mode }}\` 執行結果"
            echo
            echo '```'
            tail -c 400000 run.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          CSV=data/adj/corporate_actions_detected.csv
          if [ -f "$CSV" ]; then
            {
              echo "## 偵測清單（全部）"
              echo
              python - <<'PY'
          import pandas as pd
          df = pd.read_csv("data/adj/corporate_actions_detected.csv", dtype={"stock_id": str})
          cols = [c for c in ["stock_id","event_date","prev_close","close",
                              "chg%","ratio","還原後漲跌%","方向","判定"] if c in df.columns]
          print(df[cols].to_markdown(index=False))
          PY
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上傳結果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corporate-actions-${{ inputs.mode }}
          path: |
            run.log
            data/adj/corporate_actions_detected.csv
          if-no-files-found: warn

      - name: 提交回 repo
        if: ${{ inputs.mode != 'dry-run' }}
        run: |
          # 備份資料夾不進 git —— parquet 本來就有 git 歷史，要還原用 revert 就好
          rm -rf data/adj/_backup_before_fix
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/adj
          if git diff --cached --quiet; then
            echo "沒有變更，不提交"
          else
            git commit -m "chore(data): 公司行動 ${{ inputs.mode }}"
            git pull --rebase --autostash
            git push
          fi
