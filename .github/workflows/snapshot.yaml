name: Weekly snapshot

# 排程時間避開整點：GitHub 的排程在 :00 最擁擠，負載高時會延遲甚至直接丟掉。
# 2026-08-31 那次 minervini_picks 的 daily_adj 17:00 首班就是這樣沒觸發。
# 排程由 cron-job.org 從外部觸發（POST 到 Actions dispatch API）。
# GitHub 內建的 cron 是 best-effort，實測 2026-09-01 延遲超過 5 小時，
# 而 workflow_dispatch 走不同佇列，幾乎即時。
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install pandas numpy requests pyarrow

      - name: Snapshot stages
        run: python scripts/snapshot.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "stages $(date +%Y-%m-%d)"
          git pull --rebase || true
          git push

      - name: Report freshness
        run: |
          python - <<'PY'
          import pandas as pd
          s = pd.read_parquet("data/stages.parquet")
          col = "date" if "date" in s.columns else s.columns[0]
          print(f"::notice::stages 最新 {s[col].max()}　{len(s):,} 列")
          PY
